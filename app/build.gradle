apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'

android {
    namespace "com.example.steamgrab"
    compileSdk 34

    defaultConfig {
        applicationId "com.example.steamgrab"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildFeatures {
        compose true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }
}

dependencies {
    implementation "androidx.core:core-ktx:1.13.1"
    implementation "androidx.activity:activity-compose:1.9.0"
    implementation platform("androidx.compose:compose-bom:2024.05.00")
    implementation "androidx.compose.ui:ui"
    implementation "androidx.compose.material3:material3"
    implementation "androidx.lifecycle:lifecycle-viewmodel-compose:2.8.0"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.8.0"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2"

    implementation "in.dragonbra:javasteam:1.8.0"
    implementation "in.dragonbra:javasteam-depotdownloader:1.8.0"
    // Enum dari javasteam (EAuthSessionGuardType) mewarisi kelas protobuf. Tanpa ini kompilasi gagal.
    // Versi sama dengan yang dipakai library (gradle/libs.versions.toml di JavaSteam).
    implementation "com.google.protobuf:protobuf-java:4.35.1"
    // JavaSteam memasang dua library dekompresi ini sebagai compileOnly, jadi tidak ikut masuk APK.
    // Tanpa xz, download langsung crash dengan NoClassDefFoundError org.tukaani.xz.LZMAInputStream
    // karena chunk game dikompres LZMA. Versi sama dengan gradle/libs.versions.toml di JavaSteam.
    implementation "org.tukaani:xz:1.12"
    // Chunk yang dikompres zstd. Varian @aar membawa library native untuk Android.
    implementation "com.github.luben:zstd-jni:1.5.7-11@aar"
    implementation "com.madgag.spongycastle:prov:1.58.0.0"
}
